<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סטטוס האתר</title><meta name="description" content="מצב השירות של סטודיו המזכרות בזמן אמת."><link rel="canonical" href="%%SITE%%/status.html"><meta property="og:type" content="website"><meta property="og:locale" content="he_IL"><meta property="og:site_name" content="סטודיו המזכרות"><meta property="og:title" content="סטטוס האתר"><meta property="og:description" content="מצב השירות של סטודיו המזכרות בזמן אמת."><meta property="og:image" content="%%SITE%%/og.jpg"><meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#fbf7f1;--tx:#1d1d1b;--mu:#6b6459;--card:#fff;--bd:#e5ddd0;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--tx:#eeede8;--mu:#a8a398;--card:#21201e;--bd:#38352f;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,"Segoe UI",Arial,sans-serif}main{max-width:620px;margin:auto;padding:22px 18px 60px}
h1{font-size:26px;margin:6px 0 14px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0;display:flex;gap:12px;align-items:center}
.d{width:14px;height:14px;border-radius:50%;background:var(--mu);flex:none}.ok .d{background:var(--ok)}.bad .d{background:var(--bad)}.warn .d{background:var(--warn)}.mu{color:var(--mu);font-size:14px}a{color:var(--ac)}
</style><link rel="stylesheet" href="/polish.css"></head><body><main>
<h1>🟢 סטטוס האתר</h1>
<div class="c" id="s1"><span class="d"></span><div><b>האתר והשרת</b><div class="mu" id="t1">בודק…</div></div></div>
<div class="c" id="s2"><span class="d"></span><div><b>תחזוקה</b><div class="mu" id="t2">בודק…</div></div></div>
<div class="c" id="s3"><span class="d"></span><div><b>גרסה</b><div class="mu" id="t3">בודק…</div></div></div>
<p class="mu">הדף מתרענן מעצמו כל 30 שניות. <a href="/">חזרה לאתר</a></p>
</main><script>
const $=id=>document.getElementById(id),set=(n,cls,t)=>{$("s"+n).className="c "+cls;$("t"+n).textContent=t};
async function chk(){
 try{const t0=performance.now(),r=await fetch("/api/ping",{cache:"no-store"}),d=await r.json();set(1,d.ok?"ok":"bad",d.ok?"תקין · זמן תגובה "+Math.round(performance.now()-t0)+" מ״ש":"השרת מחזיר שגיאה (ייתכן שמסד הנתונים לא מחובר)")}catch(e){set(1,"bad","לא מצליח להתחבר לשרת")}
 try{let m=null;try{m=await (await fetch("/api/maint",{cache:"no-store"})).json()}catch(e){}if(!m||m.on===undefined)m=await (await fetch("/maintenance.json",{cache:"no-store"})).json();
  const now=Date.now(),at=m.at?Date.parse(m.at):0;
  if(m.on||(m.warn&&at&&at<now&&at+12*36e5>now))set(2,"bad","🔧 משפצים את האתר כרגע"+(m.msg?": "+m.msg:""));
  else if(m.warn&&at>now)set(2,"warn","תחזוקה מתחילה בעוד "+Math.max(1,Math.round((at-now)/6e4))+" דקות"+(m.msg?": "+m.msg:""));else set(2,"ok","אין עבודות תחזוקה")}catch(e){set(2,"warn","לא ידוע")}
 try{const c=await (await fetch("/changelog.json",{cache:"no-store"})).json(),v=c.versions[0];set(3,"ok",v.v+" · "+v.title+" · "+v.date)}catch(e){set(3,"warn","לא ידוע")}}
chk();setInterval(chk,30000);
</script></body></html>
