# בדיקות אוטומטיות על כל דחיפה ו-Pull Request (תחביר, JSON, התראות, וחבילות דפדפן מול שרת מקומי)
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-save three@0.128.0
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/run.py
        env:
          THREE_JS: node_modules/three/build/three.min.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/out/
