# בדיקות אוטומטיות על כל דחיפה ו-Pull Request (תחביר, JSON, התראות, וחבילות דפדפן מול שרת מקומי)
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-save three@0.128.0
      - run: pip install playwright && playwright install --with-deps chromium
      - id: t
        run: python3 tests/run.py
        env:
          THREE_JS: node_modules/three/build/three.min.js
      - name: צילומי מסך + דוח לדיסקורד (רק אם הוגדר הסוד DISCORD_WEBHOOK_URL)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          THREE_JS: node_modules/three/build/three.min.js
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          (cd tests && node serve.mjs >/dev/null 2>&1 &) ; sleep 2
          python3 tests/shots.py || true
          python3 tests/report.py "בדיקות אוטומטיות (GitHub)" || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/out/
