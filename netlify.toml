[build]
  command = "node scripts/inject-site-url.mjs"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/maintenance.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/news.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/maint.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
